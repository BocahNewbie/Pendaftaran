<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABY PLAY DATE 2026 - Festival & Lomba Si Kecil</title>

    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">

    <!-- Config script -->
    <script src="config.js"></script>
    <script>
        if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.tailwindTheme) {
            tailwind.config = APP_CONFIG.tailwindTheme;
        }
    </script>
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans antialiased selection:bg-pink-400 selection:text-slate-950 overflow-x-hidden min-h-screen">

    <!-- Component Containers -->
    <div id="navbar-component"></div>

    <main class="relative pt-20">
        <div id="hero-component"></div>
        <div id="deskripsi-component"></div>
        <div id="phases-component"></div>
        <div id="tujuan-component"></div>
        <div id="hadiah-component"></div>
        
        <!-- FAQ Section -->
        <section class="py-20 max-w-4xl mx-auto px-4">
            <div class="text-center mb-12">
                <span class="text-emerald-700 font-bold text-xs uppercase tracking-widest bg-emerald-100 px-3 py-1 rounded-full">Pusat Informasi</span>
                <h2 class="text-3xl font-black text-slate-900 mt-2">Pertanyaan Umum (FAQ)</h2>
                <p class="text-slate-600 text-xs mt-2 font-medium">Punya pertanyaan seputar acara? Kamu bisa memperbarui daftar pertanyaan ini melalui file <code class="text-emerald-700 font-bold">config.js</code>.</p>
            </div>
            <div id="faq-container" class="space-y-4"></div>
        </section>

        <!-- Daftar Kontak Kami -->
        <section id="sosmed" class="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <span class="text-emerald-700 font-bold text-xs uppercase tracking-widest bg-emerald-100 px-3 py-1 rounded-full">Hubungi Kami</span>
                <h2 class="text-3xl sm:text-4xl font-black text-slate-900 mt-2 mb-3">Daftar Kontak Kami</h2>
                <p class="text-slate-600 max-w-2xl mx-auto font-medium">Hubungi tim panitia atau bergabung dengan saluran informasi resmi kami.</p>
            </div>
            <div id="sosmed-container" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <!-- Sponsor Section Berbentuk Card -->
        <section id="sponsor" class="py-20 bg-emerald-50/70 border-y-2 border-emerald-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <span class="text-emerald-700 font-bold text-xs uppercase tracking-widest bg-emerald-100 px-3 py-1 rounded-full">Brand Pendukung & Sponsor Resmi</span>
                <h2 class="text-3xl font-black text-slate-900 mt-2 mb-10">Didukung Oleh</h2>
                <div id="sponsor-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </div>
        </section>

        <div id="panitia-component"></div>
    </main>

    <div id="footer-component"></div>
    <div id="modals-component"></div>

    <!-- Core Scripts -->
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    
    <script>
        async function loadComponent(id, file) {
            try {
                const res = await fetch(`components/${file}`);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                document.getElementById(id).innerHTML = await res.text();
            } catch (err) {
                console.error(`Gagal memuat komponen: components/${file}`, err);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await Promise.all([
                loadComponent('navbar-component', 'navbar.html'),
                loadComponent('hero-component', 'hero.html'),
                loadComponent('deskripsi-component', 'deskripsi.html'),
                loadComponent('phases-component', 'pricing-phases.html'),
                loadComponent('tujuan-component', 'tujuan.html'),
                loadComponent('hadiah-component', 'hadiah.html'),
                loadComponent('panitia-component', 'panitia.html'),
                loadComponent('footer-component', 'footer.html'),
                loadComponent('modals-component', 'modals.html')
            ]);

            if (typeof initAppFromConfig === 'function') {
                initAppFromConfig();
            }

            const btnMobile = document.getElementById('mobile-menu-btn');
            if (btnMobile) {
                btnMobile.addEventListener('click', toggleMobileMenu);
            }

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
