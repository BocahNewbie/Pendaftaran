<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERFEST 2026 - National Tech & Design Competition</title>

    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">

    <!-- Config script -->
    <script src="config.js"></script>
    <script>
        if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.tailwindTheme) {
            tailwind.config = APP_CONFIG.tailwindTheme;
        }
    </script>
</head>
<body class="bg-[#06100c] text-slate-100 font-sans antialiased selection:bg-[#34d399] selection:text-slate-950 overflow-x-hidden min-h-screen">

    <!-- Component Containers -->
    <div id="navbar-component"></div>

    <main class="relative pt-20">
        <div id="hero-component"></div>
        <div id="deskripsi-component"></div>
        <div id="phases-component"></div>
        <div id="tujuan-component"></div>
        <div id="hadiah-component"></div>
        
        <!-- FAQ Section -->
        <section class="py-20 max-w-4xl mx-auto px-4">
            <div class="text-center mb-12">
                <span class="text-[#34d399] font-mono text-xs uppercase tracking-widest">Pusat Informasi</span>
                <h2 class="text-3xl font-extrabold text-white mt-1">Pertanyaan Umum (FAQ)</h2>
            </div>
            <div id="faq-container" class="space-y-4"></div>
        </section>

        <!-- Sosmed / Komunitas Section -->
        <section id="sosmed" class="py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white mb-4">Bergabung dengan Komunitas</h2>
                <p class="text-slate-300 max-w-2xl mx-auto">Ikuti saluran komunikasi resmi kami untuk info pendaftaran & pengumuman terbaru.</p>
            </div>
            <div id="sosmed-container" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <!-- Sponsor Section -->
        <section id="sponsor" class="py-20 bg-[#040a08]/80 border-y border-emerald-900/30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <span class="text-slate-400 text-xs uppercase tracking-widest font-semibold">Didukung oleh Perusahaan Teknologi Ternama</span>
                <div id="sponsor-container" class="mt-10 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-8 items-center opacity-75"></div>
            </div>
        </section>

        <!-- Pesan Panitia Section -->
        <section id="panitia" class="py-24 max-w-5xl mx-auto px-4 text-center">
            <div class="glass-card p-10 sm:p-14 rounded-3xl border border-emerald-500/30 relative overflow-hidden">
                <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-[#34d399] flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="heart" class="w-8 h-8 fill-emerald-400"></i>
                </div>
                <h2 class="text-2xl sm:text-4xl font-bold text-white mb-6">Pesan dari Panitia Penyelenggara</h2>
                <p id="panitia-message" class="text-slate-300 text-base sm:text-lg leading-relaxed max-w-3xl mx-auto italic mb-8"></p>
                <div id="panitia-signature" class="text-[#34d399] font-bold tracking-wider uppercase text-sm"></div>
            </div>
        </section>
    </main>

    <div id="footer-component"></div>
    <div id="modals-component"></div>

    <!-- Core Scripts -->
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    
    <script>
        async function loadComponent(id, file) {
            try {
                const res = await fetch(`components/${file}`);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                document.getElementById(id).innerHTML = await res.text();
            } catch (err) {
                console.error(`Gagal memuat komponen: components/${file}`, err);
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await Promise.all([
                loadComponent('navbar-component', 'navbar.html'),
                loadComponent('hero-component', 'hero.html'),
                loadComponent('deskripsi-component', 'deskripsi.html'),
                loadComponent('phases-component', 'pricing-phases.html'),
                loadComponent('tujuan-component', 'tujuan.html'),
                loadComponent('hadiah-component', 'hadiah.html'),
                loadComponent('footer-component', 'footer.html'),
                loadComponent('modals-component', 'modals.html')
            ]);

            if (typeof initAppFromConfig === 'function') {
                initAppFromConfig();
            }

            const btnMobile = document.getElementById('mobile-menu-btn');
            if (btnMobile) {
                btnMobile.addEventListener('click', toggleMobileMenu);
            }

            if (window.lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
